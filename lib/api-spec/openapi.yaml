openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: store
    description: Storefront, guest orders, and product assistance
  - name: admin
    description: Store administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: getProducts
      tags: [store]
      summary: List storefront products
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
      responses:
        "200":
          description: Product collection
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /products/{productId}:
    get:
      operationId: getProduct
      tags: [store]
      summary: Get product details
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { description: Product not found }
  /products/{productId}/similar:
    get:
      operationId: getSimilarProducts
      tags: [store]
      summary: Recommend similar products
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Similar products ranked by price and size
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /orders:
    post:
      operationId: createGuestOrder
      tags: [store]
      summary: Submit an order without registering
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestOrderInput" }
      responses:
        "201":
          description: Order recorded for follow-up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestOrder" }
  /assistant/chat:
    post:
      operationId: chatAboutProduct
      tags: [store]
      summary: Ask Cohere about a laptop
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductChatInput" }
      responses:
        "200":
          description: Product-spec answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductChatResponse" }
        "503": { description: Cohere API key is not configured }
  /settings:
    get:
      operationId: getStoreSettings
      tags: [store]
      summary: Get storefront presentation settings
      responses:
        "200":
          description: Current storefront settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSettings" }
  /track:
    post:
      operationId: trackPageVisit
      tags: [store]
      summary: Record an anonymous page visit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PageVisitInput" }
      responses:
        "200": { description: Visit recorded }
  /admin/products:
    get:
      operationId: getAdminProducts
      tags: [admin]
      summary: List products in the admin area
      responses:
        "200":
          description: Product collection
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createAdminProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /admin/products/{productId}:
    patch:
      operationId: updateAdminProduct
      tags: [admin]
      summary: Update product details
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteAdminProduct
      tags: [admin]
      summary: Remove a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "204": { description: Product deleted }
  /admin/orders:
    get:
      operationId: getAdminOrders
      tags: [admin]
      summary: List guest orders
      responses:
        "200":
          description: Order collection
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GuestOrder" }
  /admin/images:
    post:
      operationId: uploadAdminImage
      tags: [admin]
      summary: Upload a laptop image for a product listing
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AdminImageInput"
      responses:
        "201":
          description: Image saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminImageResponse" }
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in to store administration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginInput" }
      responses:
        "200":
          description: Admin session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { description: Invalid credentials }
        "503": { description: Admin password is not configured }
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check whether the current browser has an admin session
      responses:
        "200":
          description: Current admin session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Sign out of store administration
      responses:
        "200": { description: Admin session ended }
  /admin/settings:
    put:
      operationId: updateStoreSettings
      tags: [admin]
      summary: Update storefront presentation settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreSettingsInput" }
      responses:
        "200":
          description: Storefront settings saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSettings" }
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: View anonymous storefront analytics
      responses:
        "200":
          description: Anonymous visits, top pages, and recent page views
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnalytics" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, brand, category, price, description, images, specs, stock, featured]
      properties:
        id: { type: string }
        name: { type: string }
        brand: { type: string }
        category: { type: string }
        price: { type: number }
        description: { type: string }
        images:
          type: array
          items: { type: string }
        specs:
          type: object
          additionalProperties: { type: string }
        stock: { type: integer }
        featured: { type: boolean }
    ProductInput:
      type: object
      required: [name, brand, category, price, description, images, specs, stock, featured]
      properties:
        name: { type: string, minLength: 1 }
        brand: { type: string, minLength: 1 }
        category: { type: string }
        price: { type: number, minimum: 0 }
        description: { type: string }
        images:
          type: array
          items: { type: string }
        specs:
          type: object
          additionalProperties: { type: string }
        stock: { type: integer, minimum: 0 }
        featured: { type: boolean }
    GuestOrderItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
    GuestOrderInput:
      type: object
      required: [name, email, phone, deliveryAddress, items]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 1 }
        deliveryAddress: { type: string, minLength: 1 }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/GuestOrderItem" }
    GuestOrder:
      type: object
      required: [id, reference, name, email, phone, deliveryAddress, items, total, status, paymentStatus]
      properties:
        id: { type: string }
        reference: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        deliveryAddress: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/GuestOrderItem" }
        total: { type: number }
        status: { type: string }
        paymentStatus: { type: string }
    ProductChatInput:
      type: object
      required: [productId, message]
      properties:
        productId: { type: string }
        message: { type: string, minLength: 1 }
    ProductChatResponse:
      type: object
      required: [reply]
      properties:
        reply: { type: string }
    AdminImageInput:
      type: object
      required: [image]
      properties:
        image:
          type: string
          format: binary
    AdminImageResponse:
      type: object
      required: [url]
      properties:
        url: { type: string }
    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    AdminSession:
      type: object
      required: [authenticated, username, configured]
      properties:
        authenticated: { type: boolean }
        username: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        configured: { type: boolean }
    StoreSettings:
      type: object
      required: [accentColor]
      properties:
        accentColor: { type: string }
    StoreSettingsInput:
      type: object
      required: [accentColor]
      properties:
        accentColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
    PageVisitInput:
      type: object
      required: [visitorId, path]
      properties:
        visitorId: { type: string, minLength: 16, maxLength: 80 }
        path: { type: string, minLength: 1, maxLength: 100 }
    PageVisit:
      type: object
      required: [visitor, path, visitedAt]
      properties:
        visitor: { type: string }
        path: { type: string }
        visitedAt: { type: string, format: date-time }
    PageCount:
      type: object
      required: [path, views]
      properties:
        path: { type: string }
        views: { type: integer }
    AdminAnalytics:
      type: object
      required: [totalVisits, uniqueVisitors, recentVisits, topPages]
      properties:
        totalVisits: { type: integer }
        uniqueVisitors: { type: integer }
        recentVisits:
          type: array
          items: { $ref: "#/components/schemas/PageVisit" }
        topPages:
          type: array
          items: { $ref: "#/components/schemas/PageCount" }

