kind = "web"
previewPath = "/"
title = "Synkline Stores"
description = "A Flask-rendered laptop storefront with guest orders, image galleries, product comparisons, anonymous visitor analytics, admin product management, and Cohere chat when configured."
version = "1.0.0"
id = "artifacts/synkline-stores"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 24909

[services.development]
run = "uv run --project ../.. python ../../app.py"

[services.production.build]
args = ["uv", "sync", "--project", "../../", "--locked"]

[services.production.run]
args = ["uv", "run", "--project", "../../", "gunicorn", "--chdir", "../../", "--bind", "0.0.0.0:24909", "app:app"]

[services.production.run.env]
PORT = "24909"
